[project]
name = "sinatra-dev"
version = "0.1.1"
description = "Official Python client for sinatra.dev, the AI coding agent that turns Linear and GitHub issues into pull requests: start, follow and stop tasks, and delegate issues."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sinatra", email = "contact@sinatra.dev" }]
keywords = [
    "sinatra",
    "sinatra.dev",
    "sdk",
    "api-client",
    "coding-agent",
    "ai-coding-agent",
    "background-agent",
    "linear",
    "github",
    "pull-request",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# What the generated code in src/sinatra_dev/_generated needs (the generator's
# own requirements for it), and nothing else.
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://www.sinatra.dev"
Documentation = "https://docs.sinatra.dev/docs/api-reference"
Repository = "https://github.com/sinatra-dev/sinatra-python"
Issues = "https://github.com/sinatra-dev/sinatra-python/issues"

[dependency-groups]
# Exact pins: the generator (and the ruff its post-hooks run) decide what
# src/sinatra_dev/_generated contains, so CI's drift check depends on them.
dev = [
    "mypy==2.4.0",
    "openapi-python-client==0.29.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinatra_dev"]

[tool.hatch.build.targets.sdist]
include = ["src/sinatra_dev", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["-ra"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/sinatra_dev/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sinatra_dev", "tests", "examples"]

# The generated httpx Client/AuthenticatedClient wrappers don't pass strict
# mypy, and the wrapper never uses them (it sends requests itself). The rest
# of the generated code, which the wrapper does use, is checked strictly.
[[tool.mypy.overrides]]
module = "sinatra_dev._generated.client"
ignore_errors = true
