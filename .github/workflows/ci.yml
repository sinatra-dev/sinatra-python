name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.14"
      # Prism, for the contract tests, needs Node 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/prism/package-lock.json

      - run: uv sync --locked
      - run: bash scripts/install-oasdiff.sh

      - name: Generated code matches openapi.json
        run: bash scripts/check-generated.sh

      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - name: Contract tests (Prism)
        run: bash scripts/contract.sh
      - name: next-version.sh tests
        run: PATH="$PWD/.tools/bin:$PATH" bash scripts/next-version.test.sh

      - name: Build the sdist and wheel
        run: uv build -o dist
      - name: Package contents
        run: |
          tar -tzf dist/*.tar.gz
          unzip -l dist/*.whl

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the package supports, and the latest.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Unit tests
        run: uv run --locked pytest
      - name: Smoke-test the wheel in a clean venv
        run: |
          uv build --wheel -o dist
          bash scripts/smoke.sh ${{ matrix.python }} dist/*.whl
